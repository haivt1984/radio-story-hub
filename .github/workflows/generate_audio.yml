name: Generate Audio & Sync Supabase

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất cứ lúc nào

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Cài đặt thư viện AI Audio và Requests
        run: |
          pip install --upgrade pip
          pip install edge-tts requests beautifulsoup4
          
      - name: 4. Chạy crawler tạo Audio và đồng bộ Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python crawler_audio.py
